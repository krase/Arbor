[package]
name = "arbor"
description = "A terminal-based file manager for Linux, inspired by midnight commander."
version = "0.2.0"
edition = "2024"
readme = "README.md"
license = "MIT"
repository = "https://github.com/vishalkrkamat/Arbor"
keywords = ["file-manager", "terminal", "tui", "cli", "rust"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.28.1"
hex = "0.4.3"
ratatui = "0.29.0"

#[workspace]
#members = ["src/tryout"]

[workspace.metadata.clippy]
warn = ["clippy::all", "clippy::pedantic", "clippy::nursery"]

